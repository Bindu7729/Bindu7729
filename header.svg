<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" fill="url(#bgGrad)" rx="15" />
  <rect width="800" height="240" fill="url(#grid)" rx="15" />

  <!-- Abstract node graphic elements on right side -->
  <g opacity="0.2">
    <circle cx="680" cy="80" r="8" fill="#2563EB" />
    <circle cx="720" cy="140" r="10" fill="#7C3AED" />
    <circle cx="620" cy="160" r="6" fill="#06B6D4" />
    <line x1="680" y1="80" x2="720" y2="140" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="720" y1="140" x2="620" y2="160" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="680" y1="80" x2="620" y2="160" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4" />
  </g>

  <!-- Branding Text -->
  <g transform="translate(60, 110)">
    <!-- Main Name -->
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#accentGrad)" letter-spacing="1">
      PENUMALA BINDU
    </text>
    <!-- Tagline / Title -->
    <text x="0" y="32" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
      Computer Science Engineering Student • Full Stack Developer
    </text>
    <text x="0" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B" letter-spacing="0.5">
      Mohan Babu University (Batch 2027)
    </text>
  </g>
</svg>
